# AI 陪伴助手 配置文件
# 所有云端密钥请勿提交到公开仓库，建议通过 .env 或环境变量覆盖

app:
  name: "AI 陪伴助手"
  version: "0.1.0"
  # 首次对话由用户命名，开发期可设默认名
  companion_name: ""
  language: "zh-CN"
  # 数据目录（相对路径基于项目根目录）
  data_dir: "data"
  log_dir: "logs"
  log_level: "INFO"   # DEBUG / INFO / WARNING / ERROR

# 大语言模型
llm:
  # 当前使用哪个适配器：deepseek / local
  provider: "deepseek"
  deepseek:
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com"
    temperature: 0.8
    max_tokens: 1024
    timeout: 30
  local:
    base_url: "http://localhost:11434"
    model: "qwen2.5:7b"
    temperature: 0.8
    max_tokens: 1024
    timeout: 60

# 语音识别 ASR
asr:
  # provider: cloud_openai_whisper / cloud_xfyun / local_funasr
  # 第一阶段默认用 Whisper（与 LLM 复用 openai 包，最简单）
  # 讯飞流式 ASR 实现待补全（见 speech/xfyun_asr.py）
  provider: "cloud_openai_whisper"
  sample_rate: 16000
  channels: 1
  chunk_duration_ms: 300
  openai:
    # 不填则尝试复用 llm.deepseek.api_key（多数中转服务兼容）
    api_key: "${OPENAI_API_KEY}"
    base_url: ""                # 留空走 OpenAI 官方；可填兼容服务 URL
    model: "whisper-1"
    language: "zh"
    timeout: 30
  xfyun:
    app_id: "${XFYUN_APP_ID}"
    api_key: "${XFYUN_API_KEY}"
    api_secret: "${XFYUN_API_SECRET}"

# 语音合成 TTS
tts:
  # provider: cloud_openai_tts / cloud_volc / local_cosyvoice
  # 第一阶段默认用 OpenAI TTS（与 LLM/ASR 复用 openai 包，最简单）
  # 火山引擎情感 TTS 待 T2-06 补全 WebSocket 实现
  provider: "cloud_openai_tts"
  openai:
    # 不填则尝试复用 llm.deepseek.api_key（多数中转服务兼容）
    api_key: "${OPENAI_API_KEY}"
    base_url: ""                # 留空走 OpenAI 官方；可填兼容服务 URL
    model: "tts-1"              # tts-1 / tts-1-hd
    voice: "nova"               # nova 是 OpenAI 提供的柔和女声
    format: "mp3"
    speed: 1.0
    timeout: 30
  volc:
    app_id: "${VOLC_APP_ID}"
    access_token: "${VOLC_ACCESS_TOKEN}"
    voice_type: "zh_female_wanwan"  # 温柔女声
    speed: 1.0
    pitch: 1.0
    volume: 1.0
  cache_dir: "data/tts_cache"
  enable_cache: true
  cache_max_entries: 200

# 记忆系统
memory:
  sqlite_path: "data/companion.db"
  chroma_path: "data/chroma"
  short_term_turns: 20      # 短期记忆保留轮数
  recall_top_k: 5          # 检索召回数量
  # T2-05 长期记忆参数
  recall_threshold: 0.15   # 召回相似度阈值（低于此值不召回）
  dedup_threshold: 0.75    # 去重相似度阈值（高于此值视为重复，更新而非新增）
  long_term_enabled: true  # 是否启用长期记忆提取

# 情绪系统
emotion:
  decay_interval_sec: 600  # 情绪自然衰减间隔
  user_emotion_model: "llm" # llm / acoustic
  ai_emotion_enabled: true
  # AI 独立情绪（PAD 模型）参数
  baseline_pleasure: 0.3   # 基线愉悦度 -1~1（温柔陪伴者偏愉悦）
  baseline_arousal: -0.2   # 基线唤醒度 -1~1（偏平静）
  baseline_dominance: 0.1  # 基线支配度 -1~1（略主导）
  empathy_weight: 0.4      # 共鸣权重 0~1：AI 情绪受用户情绪影响程度
  decay_rate: 0.05         # 衰减率：每秒向基线回归比例（越小越持久）
  inertia_factor: 0.5      # 情绪惯性 0~1：当前越强烈越抗拒改变（状态机粘性）
  # 关系维度基线（T2-02，0~1）
  baseline_affection: 0.3    # 对用户的亲近感基线
  baseline_loneliness: 0.1   # 孤独感基线
  baseline_concern: 0.1      # 担忧基线
  baseline_playfulness: 0.2  # 调皮/趣味性基线
  # 沉默累积（T2-02）：每秒 loneliness 上升量，默认 6 小时累积到 0.5
  silence_loneliness_rate: 0.0000231  # ≈ 0.5 / 21600
  # 亲密度调节初始值（T2-03 接入后由亲密度系统更新）
  intimacy_score: 5.0

# 亲密度系统
intimacy:
  initial_score: 5.0
  max_score: 100.0
  deep_talk_gain: 2.0
  mention_user_fact_gain: 3.0
  hurt_loss_min: 5.0
  hurt_loss_max: 15.0
  silence_days_loss: 2.0
  daily_chat_gain: 0.5

# 主动话题
proactive:
  silence_threshold_sec: 21600  # 6 小时
  morning_hour: 8
  night_remind_hour: 23
  random_share_prob: 0.05

# 唤醒词
wake_word:
  enabled: false        # 第二阶段开启
  engine: "openwakeword"  # openwakeword / porcupine
  keyword: ""

# 桌面 UI
ui:
  type: "electron"      # electron / pyqt
  websocket_port: 8765
  http_port: 8766
  live2d_model_path: "ui/assets/live2d/default"

# 工具
tools:
  music:
    enabled: false
    kugou_path: ""
  weather:
    enabled: false
    api: "qweather"
    api_key: "${QWEATHER_API_KEY}"

# 本地 HTTP API（供 Electron 前端调用）
server:
  host: "127.0.0.1"
  port: 18731
